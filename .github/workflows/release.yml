name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release ${GITHUB_REF_NAME} already exists; skipping to avoid replacing pinned assets"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build all platforms and write SHA256SUMS
        if: steps.check.outputs.exists == 'false'
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath \
              -ldflags "-s -w \
                -X gitee.com/IKEJAY-code/uclash/internal/version.Version=${GITHUB_REF_NAME:-dev} \
                -X gitee.com/IKEJAY-code/uclash/internal/version.Commit=$(git rev-parse --short HEAD) \
                -X gitee.com/IKEJAY-code/uclash/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "dist/uclash-${target%/*}-${target#*/}" ./cmd/uclash
            echo "built dist/uclash-${target%/*}-${target#*/}"
          done
          ( cd dist && sha256sum uclash-* > SHA256SUMS )
          cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.exists == 'false'
        with:
          files: dist/*
          generate_release_notes: true
